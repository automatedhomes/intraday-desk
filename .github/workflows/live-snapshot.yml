# Rebuilds the Intraday Desk snapshot and publishes it to GitHub Pages every 5 minutes
# while NSE is open (09:15-15:40 IST = 03:45-10:10 UTC, Mon-Fri, NSE holidays skipped in Python).
# GitHub's own schedule is unreliable on free accounts (it ran once on 09 Nov 2026), so an outside timer
# (cron-job.org) also calls workflow_dispatch every 5 minutes; those runs behave exactly like scheduled ones.
name: Live snapshot

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Build now even if the market is closed (does not touch the paper journal)"
        type: boolean
        default: false

permissions:
  contents: write             # to save journal/paper_journal.json when the monthly picks are logged
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      built: ${{ steps.snap.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas numpy
      - run: python tests/test_smoke.py
      - id: snap
        name: Build snapshot
        run: |
          # Automatic runs (schedule or the outside timer) build only in market hours and log the paper journal
          # at live prices. A forced manual run builds any time and leaves the journal alone.
          if [ "${{ inputs.force }}" = "true" ]; then FLAG=""; else FLAG="--if-open --journal"; fi
          python intraday_dashboard.py --snapshot site --standalone $FLAG
          if [ -f site/index.html ]; then echo "built=yes" >> "$GITHUB_OUTPUT"; else echo "built=no" >> "$GITHUB_OUTPUT"; fi
      - name: Save paper journal
        if: steps.snap.outputs.built == 'yes' && inputs.force != true
        run: |
          if [ -n "$(git status --porcelain journal)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898494+github-actions[bot]@users.noreply.github.com"
            git add journal
            git commit -m "Paper journal: log monthly picks"
            git pull --rebase -q && git push
          fi
      - if: steps.snap.outputs.built == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
